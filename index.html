<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - Professional To-Do List</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="header-content">
                <h1>TaskFlow</h1>
                <p class="tagline">Organize Your Work, Achieve Your Goals</p>
            </div>
        </header>

        <main class="main-content">
            <div class="input-section">
                <div class="input-wrapper">
                    <input 
                        type="text" 
                        id="taskInput" 
                        class="task-input" 
                        placeholder="Add a new task..."
                        aria-label="New task input"
                    >
                    <button id="addBtn" class="add-btn" aria-label="Add task">
                        <span class="btn-icon">+</span>
                        <span class="btn-text">Add Task</span>
                    </button>
                </div>
            </div>

            <div class="stats-section">
                <div class="stat-card">
                    <span class="stat-label">Total Tasks</span>
                    <span class="stat-value" id="totalTasks">0</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">Completed</span>
                    <span class="stat-value" id="completedTasks">0</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">Pending</span>
                    <span class="stat-value" id="pendingTasks">0</span>
                </div>
            </div>

            <div class="filter-section">
                <button class="filter-btn active" data-filter="all">All Tasks</button>
                <button class="filter-btn" data-filter="active">Active</button>
                <button class="filter-btn" data-filter="completed">Completed</button>
            </div>

            <div class="tasks-container">
                <ul id="taskList" class="task-list"></ul>
                <div id="emptyState" class="empty-state">
                    <p>No tasks yet. Start by adding your first task!</p>
                </div>
            </div>

            <div class="actions-section">
                <button id="clearBtn" class="clear-btn" aria-label="Clear completed tasks">
                    Clear Completed
                </button>
            </div>
        </main>

        <footer class="footer">
            <p>&copy; 2026 TaskFlow. Stay productive and organized.</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
