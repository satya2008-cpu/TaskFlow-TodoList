<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - Professional To-Do List</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="main-wrapper">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>TaskFlow</h2>
            </div>
            <nav class="sidebar-nav">
                <ul>
                    <li><a href="#" class="nav-item active" data-filter="all"><i class="fas fa-inbox"></i> All Tasks</a></li>
                    <li><a href="#" class="nav-item" data-filter="active"><i class="fas fa-circle"></i> Active</a></li>
                    <li><a href="#" class="nav-item" data-filter="completed"><i class="fas fa-check-circle"></i> Completed</a></li>
                </ul>
            </nav>
            <div class="sidebar-footer">
                <p class="text-muted">TaskFlow v1.0</p>
            </div>
        </aside>

        <!-- Main Content -->
        <div class="main-content">
            <header class="top-header">
                <div class="header-left">
                    <h1>TaskFlow</h1>
                    <p class="header-subtitle">Organize Your Work, Achieve Your Goals</p>
                </div>
                <div class="header-right">
                    <div id="currentDate" class="current-date"></div>
                </div>
            </header>

            <!-- Stats Cards -->
            <div class="stats-dashboard">
                <div class="stat-box">
                    <div class="stat-icon total">
                        <i class="fas fa-tasks"></i>
                    </div>
                    <div class="stat-info">
                        <span class="stat-value" id="totalTasks">0</span>
                        <span class="stat-label">Total Tasks</span>
                    </div>
                </div>
                <div class="stat-box">
                    <div class="stat-icon active">
                        <i class="fas fa-hourglass-start"></i>
                    </div>
                    <div class="stat-info">
                        <span class="stat-value" id="pendingTasks">0</span>
                        <span class="stat-label">Pending</span>
                    </div>
                </div>
                <div class="stat-box">
                    <div class="stat-icon completed">
                        <i class="fas fa-check"></i>
                    </div>
                    <div class="stat-info">
                        <span class="stat-value" id="completedTasks">0</span>
                        <span class="stat-label">Completed</span>
                    </div>
                </div>
            </div>

            <!-- Input Section -->
            <div class="input-card">
                <div class="input-wrapper">
                    <input 
                        type="text" 
                        id="taskInput" 
                        class="task-input" 
                        placeholder="What needs your attention?"
                        aria-label="New task input"
                    >
                    <button id="addBtn" class="add-btn" aria-label="Add task">
                        <i class="fas fa-plus"></i>
                        <span>Add task</span>
                    </button>
                </div>
            </div>

            <!-- Filter Buttons -->
            <div class="filter-tabs">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="active">Open</button>
                <button class="filter-btn" data-filter="completed">Done</button>
            </div>

            <!-- Tasks Container -->
            <div class="tasks-card">
                <ul id="taskList" class="task-list"></ul>
                <div id="emptyState" class="empty-state">
                    <div class="empty-icon">
                        <i class="fas fa-inbox"></i>
                    </div>
                    <p class="empty-message">Your list is clear. Add something small to begin.</p>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="action-buttons">
                <button id="clearBtn" class="clear-btn" aria-label="Clear completed tasks">
                    <i class="fas fa-trash"></i> Clear completed
                </button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
